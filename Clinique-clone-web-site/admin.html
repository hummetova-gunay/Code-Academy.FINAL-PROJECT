<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./scss/main.css">
    <title>Admin panel</title>
</head>
<body class="adminpage">
    <header class="admin-header">
        <div class="container">
            <div class="header">
                <div class="menu-search">
                      <button class="btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasnavbar" aria-controls="offcanvasExample">
                        <i class="fa-solid fa-bars"></i>
                      </button>
                      <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasnavbar" aria-labelledby="offcanvasExampleLabel">
                        <div class="offcanvas-header">
                          <h2 class="offcanvas-title" id="offcanvasExampleLabel">Gunay</h2>
                          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                        </div>
                        <div class="offcanvas-body">
                            <div class="heading">
                                <div class="admin-photo">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                                <h4>Hummatova Gunay</h4>
                                <div class="social-media">
                                    <i class="fa-brands fa-facebook"></i>
                                    <i class="fa-brands fa-linkedin"></i>
                                    <i class="fa-brands fa-twitter"></i>
                                </div>
                            </div>
                            <div class="pages">
                                <a href="./admin.html" class="btn">Home</a>
                                <a href="./admin-all-products.html" class="btn">All products</a>
                                <a href="./edit-add-products-admin.html" class="btn">Edit products</a>
                                <a href="./admin-bestseller" class="btn">See Bestsellers</a>
                                <a href="./index.html" class="btn">Clinique</a>
                            </div>
                        </div>
                      </div>
                      <div class="container-input">
                        <input type="text" placeholder="Search" name="text" class="input">
                        <svg fill="#fff" width="20px" height="20px" viewBox="0 0 1920 1920" xmlns="http://www.w3.org/2000/svg">
                          <path d="M790.588 1468.235c-373.722 0-677.647-303.924-677.647-677.647 0-373.722 303.925-677.647 677.647-677.647 373.723 0 677.647 303.925 677.647 677.647 0 373.723-303.924 677.647-677.647 677.647Zm596.781-160.715c120.396-138.692 193.807-319.285 193.807-516.932C1581.176 354.748 1226.428 0 790.588 0S0 354.748 0 790.588s354.748 790.588 790.588 790.588c197.647 0 378.24-73.411 516.932-193.807l516.028 516.142 79.963-79.963-516.142-516.028Z" fill-rule="evenodd"></path>
                      </svg>
                      </div>
                      
                </div>
                <div class="profile">
                    <i class="fa-regular fa-envelope"></i>
                    <i class="fa-solid fa-bell"></i>  
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
        </div>
    </header>
    <section id="admin-home">
        <div class="container">
            <div class="progress-part">
                <div class="single-progress">
                   <div class="progress-text">
                    <h2>Orders:</h2>
                    <h2>10000</h2>
                   </div>
                    <div class="progress" role="progressbar" aria-label="Basic example" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar" style="width: 25%"></div>
                      </div>
                </div>
                <div class="single-progress">
                   <div class="progress-text">
                    <h2>progress-text:</h2>
                    <h2>10000</h2>
                   </div>
                    <div class="progress" role="progressbar" aria-label="Basic example" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar" style="width: 25%"></div>
                      </div>
                </div>
                <div class="single-progress">
                   <div class="progress-text">
                    <h2>Yearly Sales:</h2>
                    <h2>10000</h2>
                   </div>
                    <div class="progress" role="progressbar" aria-label="Basic example" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar" style="width: 25%"></div>
                      </div>
                </div>

            </div>
            <canvas id="productChart"></canvas>
            <canvas id="visitChart"></canvas>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js" integrity="sha512-uMtXmF28A2Ab/JJO2t/vYhlaa/3ahUOgj1Zf27M5rOo8/+fcTUVH0/E0ll68njmjrLqOBjXM3V9NiPFL5ywWPQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="./admin-js/admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>
</html>
