<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./scss/main.css">
    <title>Order Information</title>
</head>
<body>
    <header class="order-info-header">
        <div class="container">
            <a href="index.html">
                <h1>CLINIQUE</h1>
            </a>
        </div>
    </header>
    <section id="order-info-section">
        <div class="container">
            <div class="allData">
                <div class="user-information">
                    <div class="heading">
                        <h5>Contact information:</h5>
                        <p> (gunayhummatov@gmail.com)</p>
                    </div>
                    <h5>Delivery method</h5>
                    <div class="delivery-method">
                        <label class="container">
                            <i class="fa-solid fa-truck-fast"></i> Delivery
                            <input type="radio" checked="checked" name="radio">
                            <span class="checkmark"></span>
                          </label>
                          <label class="container">
                            <i class="fa-solid fa-bell"></i> Pick up
                            <input type="radio" name="radio">
                            <span class="checkmark"></span>
                          </label>
                    </div>
                    <div class="payment">
                        <div class="payment-method">
                            <h5>Payment</h5>
                            <div>Payment Upon Delivery</div>
                        </div>
                        <div class="payment-address">
                            <h5>Payment Address</h5>
                            <form action="">
                                <input type="text" required="" placeholder="Country" id="customersCounrty">
                                <div class="name-surname">
                                    <input type="text" required="" placeholder="Enter your first name" id="customerName">
                                    <input type="text" required="" placeholder="Enter your last name" id="customerLastName">
                                </div>
                                <input type="text" placeholder="Enter your company (optinal)" id="customerCompany">
                                <input type="text" placeholder="Address" id="customerAddress">
                                <input type="text" placeholder="Location (optinal)" id="customerLocation">
                                <div class="index-city">
                                    <input type="text" placeholder="Enter your index" id="customerIndex">
                                    <input type="text" placeholder="Enter your city" id="customerCity">
                                </div>
                                <div class="actions">
                                    <a href="./index.html">Back to home page</a>
                                    <button type="submit" class="btn">Finish order</button>
                                </div>
                            </form>
                        </div>    
                    </div>
                </div>
                <div class="purchased-product">
                    <div class="product-info">
                        <img src="" alt="">
                        <p></p>
                        <div class="purchased-product-price"></div>
                    </div>
                    <div class="calculate-price">
                        <div class="product-price"><p>Total</p> <span>$23.00</span></div>
                        <div class="kargo">
                            <p>delivery</p>
                            <span>$5</span>
                        </div>
                        <div class="general-price">
                            <p>General</p>
                            <span>$28.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>
</html>
